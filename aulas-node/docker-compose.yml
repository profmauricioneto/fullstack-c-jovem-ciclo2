version: '3.8'

services:
  backend:
    build:
      context: ./exercicio06
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=6e0ed0d864113b89a4c975b6e220f9a3
      - PORT=3000
    volumes:
      - ./exercicio06/prisma:/app/prisma
      - backend-data:/app/data
    networks:
      - app-network

  frontend:
    build:
      context: ./exercicio06-front
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:3000/api
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  backend-data:

networks:
  app-network:
    driver: bridge